[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["."]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "__pycache__", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# UP047 建议改用 PEP 695 的 `def f[T]()` 语法；本教程仍用 TypeVar，
# 因为主项目（Python 3.12/3.14）和大多数现有代码库都是这种写法。
ignore = ["UP047"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
